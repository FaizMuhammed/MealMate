<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Restaurant</title>

    {% load static %}
    
    <link rel="stylesheet" href="{% static 'add_restaurant.css' %}">

</head>
<body>
    <div class="card">
        <h3>Add New Restaurant</h3>
        <form action="{% url 'add_restaurant' %}" method="POST">
            {% csrf_token %}
            <label>Restaurant name</label><br>
            <input type="text" name="name" required>
            <br><br>
            <label>Picture url</label><br>
            <input type="text" name="picture" required>
            <br><br>
            <label>Cuisine</label><br>
            <input type="text" name="cuisine" required>
            <br><br>
            <label>Rating</label><br>
            <input type="number" name="rating" min="0" max="5" step="0.5" required>
            <br><br>
            <button type="submit">Add Restaurant</button>
        </form>
    </div>
</body>
</html>
