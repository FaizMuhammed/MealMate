<!DOCTYPE html>
<html lang="en">
    {% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    
    <link rel="stylesheet" href="{% static 'checkout.css' %}">
    
    
</head>
<body>

    <div class="navbar">
        <div class="navleft">
            <a href="{% url 'signup' %}"> <img class="logo" src="{% static 'images/logo.png' %}"></a>
        </div>
        <div class="navright">
            {{username}}
        </div>
    </div>

    <div class="checkout-card">
        <div class="checkout">
            <div class="header">
                <h1>Checkout</h1>
            </div>

            {% if error %}
            <p style="color: red;">{{ error }}</p>
            {% else %}


            <div class="price">
                <h3>Total: ₹{{ total_price }}</h3>
                <button id="rzp-button">Pay with Razorpay</button>
            </div>
            {% endif %}
        </div>
    </div>




    <script>
        var options = {
            "key": "{{ razorpay_key_id }}",  // Razorpay API key
            "amount": "{{ total_price|floatformat:2|add:'0.00'|floatformat:2 }}00", // Amount in paisa
            "currency": "INR",
            "name": "Meal Mate",
            "description": "Order Payment",
            "order_id": "{{ order_id }}",  // Razorpay order ID
            "handler": function (response) {
                alert("Payment Successful!");
                // Redirect to the orders page
                window.location.href = "{% url 'orders' username %}";

            },
            "prefill": {
                "name": "{{ username }}",
                "email": "customer@example.com",
                "contact": "9999999999"
            },
            "theme": {
                "color": "#528FF0"
            }
        };
        var rzp = new Razorpay(options);
    
        document.getElementById('rzp-button').onclick = function(e) {
            rzp.open();
            e.preventDefault();
        }
    </script>


</body>
</html>
