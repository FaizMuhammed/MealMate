    <div class="restaurant-container">

    {% for r in restaurantList %}
    <div class="restaurant-card">

        <div class="restaurant-image">
            <img src="{{ r.picture }}">
        </div>

        <div class="restaurant-details">

            <h3>{{ r.name }}</h3>

            <p class="cuisine">
                {{ r.cuisine }}
            </p>

            <p class="rating">
                ⭐ {{ r.rating }}
            </p>

            <a href="{% url 'view_menu' r.id username %}" class="menu-btn">
                View Menu
            </a>

        </div>

    </div>
    {% endfor %}

</div>
