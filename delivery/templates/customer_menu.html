<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    {% load static %}
    
    <link rel="stylesheet" href="{% static 'customer_menu.css' %}">

</head>
<body>
    <div class="header">
        <h1>Menu</h1>
        Welcome {{username}}
    </div>
    <div class="gotocart">
        <a href="{% url 'show_cart' username %}" class="cart">Go to cart</a>
    </div>
    <div class="tbl"> 
        <table>
            <thead>
                <tr>
                    <th>Item name</th>
                    <th>Picture</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Is veg?</th>
                    <th>Operation</th>
                </tr>
            </thead>
            <tbody>
                {% for item in itemList %}
                    <tr>
                        <td>{{ item.name }}</td>
                        <td>
                            <img src="{{ item.picture }}" alt="">
                        </td>
                        <td>{{ item.description }}</td>
                        <td>{{ item.price }}</td>
                        <td>{{ item.vegeterian }}</td>
                        <td>
                            <a href="{% url 'add_to_cart' item.id username %}" class="btn">
                                Add to cart
                            </a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
