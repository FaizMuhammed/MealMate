<!DOCTYPE html>
<html lang="en">
    {% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">


    
    <link rel="stylesheet" href="{% static 'customer_menu.css' %}">

</head>
<body>

    <div class="navbar">
        <div class="navleft">
            <a href="{% url 'signup' %}"> <img class="logo" src="{% static 'images/logo.png' %}"></a>
        </div>
        <div class="navright">
            <a class="cart" href="{% url 'show_cart' username %}">Cart</a>
            {{username}}
        </div>
    </div>


    <div class="header">
        <h1>Menu</h1>
        Welcome {{username}}
    </div>
    <div class="table-card">
        <div class="tbl"> 
            <table>
                <!-- <thead>
                    <tr>
                        <th>Picture</th>
                        <th>Item name</th>
                        <th>Description</th>
                        <th>Price</th>
                        <th>Operation</th>
                    </tr>
                </thead> -->
                <tbody>
                    {% for item in itemList %}
                        <tr>
                            <td>
                                <img src="{{ item.picture }}" alt="">
                            </td>
                            <!-- <td>{{ item.name }}</td>
                            <td>{{ item.description }}</td>
                            <td>{{ item.price }}</td> -->

                            <td>
                                <h2>{{ item.name }}</h2>
                                <p>{{ item.description }}</p>
                                <h5>{{ item.price }}</h5>
                            </td>


                            <td>
                                <a href="{% url 'add_to_cart' item.id username %}" class="btn">
                                    Add to cart
                                </a>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
