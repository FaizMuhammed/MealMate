<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

{% load static %}
    
    <link rel="stylesheet" href="{% static 'update_menu.css' %}">

</head>
<body>
    <h1>Menu Items</h1>
    <div class="tbl">
        <table>
            <thead>
                <tr>
                    <th>Item name</th>
                    <th>Picture</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Is veg</th>
                    <th>Operations</th>
                </tr>
            </thead>
            <tbody>
                {% for item in itemList %}
                    <tr>
                        <td>{{ item.name}} </td>
                        <td>
                            <img src="{{ item.picture }}">
                        </td>
                        <td>{{ item.description }}</td>
                        <td>{{ item.price }}</td>
                        <td>{{ item.vegeterian }}</td>
                        <td>
                            <!-- Added Delete button linking to the delete URL -->
                            <a href="{% url 'delete_menu_item' item.id %}" onclick="return confirm('Are you sure you want to delete this item?');">Delete</a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="card">
        <h3>Add Menu</h3>
        <form action="{% url 'update_menu' restaurant.id %}" method="POST">
            {% csrf_token %}
            <label for="name">Item Name:</label><br>
            <input type="text" id="name" name="name" required> <br><br>

            <label for="description">Description:</label><br>
            <textarea name="description" id="description" required></textarea> <br><br>

            <label for="price">Price:</label><br>
            <input type="number" name="price" id="price" step="0.01" required><br><br>

            <label for="vegeterian">Vegeterian:</label><br>
            <input type="checkbox" name="vegeterian" id="vegeterian"><br><br>

            <label for="picture">Image URL:</label><br>
            <input type="url" name="picture" id="picture"><br><br>

            <button type="submit">Add Item</button>
        </form>
    </div>
    
</body>
</html>
