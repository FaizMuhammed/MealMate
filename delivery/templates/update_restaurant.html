<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    {% load static %}
    
    <link rel="stylesheet" href="{% static 'update_restaurant.css' %}">

</head>
<body>
    <div class="card">
        <h3>Update Restaurant</h3>
        <form action="{% url 'update_restaurant' restaurant.id %}" method="POST">
            {% csrf_token %}
            <label>Restaurant name</label><br>
            <input type="text" name="name" value="{{restaurant.name}}">
            <br><br>
            <label>Picture url</label><br>
            <input type="text" name="picture" value="{{restaurant.picture}}">
            <br><br>
            <label>Cuisine</label><br>
            <input type="text" name="cuisine" value="{{restaurant.cuisine}}">
            <br><br>
            <label>Rating</label><br>
            <input type="number" name="rating" min="0" max="5" step="0.5" value="{{restaurant.rating}}">
            <br><br>
            <button type="submit">Update Restaurant</button>
        </form>
    </div>
</body>
</html>
